<!DOCTYPE html>
<html lang="{{{ LANGUAGE }}}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <meta name="description" content="한국어 1:1 상담자 훈련 시뮬레이션 — 상담 미세기술과 표정·시선·자세 전달을 함께 연습합니다. 감정 분류기가 아닌 연구용 프로토타입입니다.">
  <meta property="og:title" content="CounselCue · 상담자 관계 전달 연습">
  <meta property="og:description" content="Korean counselor-training simulation for relational delivery, multimodal feedback, and reflective practice.">
  <meta property="og:image" content="https://educatian.github.io/counselcue/TemplateData/social-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <main id="unity-container" aria-label="CounselCue counseling simulation">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar" role="status" aria-live="polite">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      <div id="unity-loading-label">CounselCue 불러오는 중…</div>
      <div id="unity-loading-note">연구·훈련용 프로토타입입니다. 진단이나 역량 평가 도구가 아니며, 웹캠 원본 영상은 저장하지 않습니다.</div>
    </div>
    <div id="unity-warning" aria-live="assertive"></div>
  </main>
  <div id="orientation-message" role="status">
    <strong>가로 화면으로 전환해 주세요</strong>
    <span>내담자의 표정과 상담 도구를 함께 관찰하려면 가로 화면이 필요합니다.</span>
  </div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loadingBar = document.querySelector('#unity-loading-bar');
    const progressBarFull = document.querySelector('#unity-progress-bar-full');
    function unityShowBanner(message, type) {
      const warning = document.querySelector('#unity-warning');
      const item = document.createElement('div');
      item.className = type || 'info';
      item.textContent = message;
      warning.appendChild(item);
      warning.hidden = false;
      if (type !== 'error') setTimeout(() => { item.remove(); warning.hidden = !warning.children.length; }, 5000);
    }
    const buildUrl = 'Build';
    const config = {
      arguments: [],
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };
    loadingBar.style.display = 'flex';
    const loader = document.createElement('script');
    loader.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, progress => {
      progressBarFull.style.width = (progress * 100) + '%';
    }).then(instance => {
      window.CounselCueUnity = instance;
      loadingBar.style.display = 'none';
    }).catch(message => unityShowBanner(String(message), 'error'));
    document.body.appendChild(loader);
  </script>
</body>
</html>
