<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CounselCue</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="app-shell" aria-label="CounselCue 상담 훈련">
      <section id="unity-stage" aria-label="상담 훈련 화면">
        <div id="unity-container">
          <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="CounselCue Unity 애플리케이션"></canvas>
          <div id="unity-loading-bar" role="status" aria-live="polite">
            <div id="loading-title">COUNSELCUE</div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
            <div id="loading-copy">상담 환경을 준비하고 있습니다…</div>
          </div>
          <div id="unity-warning" aria-live="assertive"></div>
          <button id="unity-fullscreen-button" type="button">전체 화면</button>
        </div>
      </section>
      <div id="counselcue-composer-slot" aria-live="polite"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBar = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        const item = document.createElement("div");
        item.className = type === "error" ? "warning-error" : "warning-message";
        item.textContent = message;
        warningBanner.appendChild(item);
        warningBanner.hidden = false;
        if (type !== "error") {
          setTimeout(() => {
            item.remove();
            warningBanner.hidden = warningBanner.children.length === 0;
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/WebGL.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Educatian",
        productName: "CounselCue",
        productVersion: "1.3.0-embodied-counseling",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(Math.max(window.devicePixelRatio || 1, 1.5), 2)
      };

      loadingBar.hidden = false;
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          progressBar.style.width = (100 * progress) + "%";
        }).then(unityInstance => {
          loadingBar.hidden = true;
          document.querySelector("#unity-fullscreen-button").onclick = () => unityInstance.SetFullscreen(1);
        }).catch(message => unityShowBanner(message, "error"));
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
