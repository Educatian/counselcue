<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>CounselCue</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <main id="unity-container" aria-label="CounselCue counseling simulation">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar" role="status" aria-live="polite">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      <div id="unity-loading-label">CounselCue 불러오는 중…</div>
    </div>
    <div id="unity-warning" aria-live="assertive"></div>
  </main>
  <div id="orientation-message" role="status">
    <strong>가로 화면으로 전환해 주세요</strong>
    <span>내담자의 표정과 상담 도구를 함께 관찰하려면 가로 화면이 필요합니다.</span>
  </div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loadingBar = document.querySelector('#unity-loading-bar');
    const progressBarFull = document.querySelector('#unity-progress-bar-full');
    function unityShowBanner(message, type) {
      const warning = document.querySelector('#unity-warning');
      const item = document.createElement('div');
      item.className = type || 'info';
      item.textContent = message;
      warning.appendChild(item);
      warning.hidden = false;
      if (type !== 'error') setTimeout(() => { item.remove(); warning.hidden = !warning.children.length; }, 5000);
    }
    const buildUrl = 'Build';
    const config = {
      arguments: [],
      dataUrl: buildUrl + '/WebGL.data',
      frameworkUrl: buildUrl + '/WebGL.framework.js',
      codeUrl: buildUrl + '/WebGL.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Educatian",
      productName: "CounselCue",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };
    loadingBar.style.display = 'flex';
    const loader = document.createElement('script');
    loader.src = buildUrl + '/WebGL.loader.js';
    loader.onload = () => createUnityInstance(canvas, config, progress => {
      progressBarFull.style.width = (progress * 100) + '%';
    }).then(instance => {
      window.CounselCueUnity = instance;
      loadingBar.style.display = 'none';
    }).catch(message => unityShowBanner(String(message), 'error'));
    document.body.appendChild(loader);
  </script>
</body>
</html>
